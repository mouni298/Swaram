<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swaram AI Streaming Demo</title>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #f7f6f2;
        color: #202020;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #202020;
        color: white;
        padding: 12px 18px;
        cursor: pointer;
      }

      button.secondary {
        background: #6d6d6d;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .panel {
        min-height: 220px;
        background: white;
        border: 1px solid #e8e5de;
        border-radius: 18px;
        padding: 20px;
      }

      .item {
        background: #f1f0ec;
        border-radius: 14px;
        margin: 10px 0;
        padding: 12px;
      }

      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Swaram AI Streaming Demo</h1>
      <p>Status: <strong id="status">idle</strong></p>
      <button id="start">Start streaming session</button>
      <button id="interrupt" class="secondary">Interrupt</button>
      <button id="stop" class="secondary">Stop</button>
      <div class="grid">
        <section class="panel">
          <h2>Live Transcript</h2>
          <div id="transcript"></div>
        </section>
        <section class="panel">
          <h2>Events</h2>
          <div id="events"></div>
        </section>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
