<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swaram AI Local Streaming Demo</title>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        margin: 0;
        background: #f7f6f2;
        color: #202020;
      }

      main {
        max-width: 1040px;
        margin: 0 auto;
        padding: 32px;
      }

      button {
        border: 0;
        border-radius: 999px;
        background: #202020;
        color: white;
        padding: 12px 18px;
        cursor: pointer;
      }

      button.secondary {
        background: #666;
      }

      select {
        border: 1px solid #d8d4ca;
        border-radius: 10px;
        background: white;
        color: #202020;
        padding: 10px 12px;
        margin-right: 10px;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        gap: 12px;
        margin: 20px 0;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      label {
        font-size: 13px;
        font-weight: 700;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px;
      }

      .panel {
        min-height: 220px;
        background: white;
        border: 1px solid #e8e5de;
        border-radius: 18px;
        padding: 20px;
      }

      pre {
        background: #f1f0ec;
        border-radius: 14px;
        margin: 10px 0;
        padding: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Swaram AI Local Streaming Demo</h1>
      <p>Status: <strong id="status">idle</strong></p>
      <div class="controls">
        <div class="field">
          <label for="language">Language</label>
          <select id="language"></select>
        </div>
        <div class="field">
          <label for="voice">Voice</label>
          <select id="voice"></select>
        </div>
        <button id="start">Start local session</button>
        <button id="interrupt" class="secondary">Interrupt</button>
        <button id="stop" class="secondary">Stop</button>
      </div>
      <div class="grid">
        <section class="panel">
          <h2>Transcript</h2>
          <div id="transcript"></div>
        </section>
        <section class="panel">
          <h2>Events</h2>
          <div id="events"></div>
        </section>
      </div>
    </main>
    <script src="/node_modules/onnxruntime-web/dist/ort.js"></script>
    <script>
      window.ort.env.wasm.wasmPaths = "/node_modules/onnxruntime-web/dist/";
    </script>
    <script src="/node_modules/@ricky0123/vad-web/dist/bundle.min.js"></script>
    <script type="module" src="./main.js"></script>
  </body>
</html>
